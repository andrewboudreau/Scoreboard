name: Bump Version and Deploy

on:
  push:
    branches:
      - master

# One deploy at a time; a newer push waits for the running one instead of racing it.
concurrency:
  group: deploy-scoreboard
  cancel-in-progress: false

jobs:
  bump_version:
    runs-on: ubuntu-latest
    # This job only runs for pushes to main, not for tags or bot commits
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Restore dependencies
        run: dotnet restore --configfile nuget.ci.config

      - name: Build
        run: dotnet build --no-restore --configfile nuget.ci.config

      - name: Bump version
        id: bump
        run: |
          file=Directory.Build.props
          version=$(grep -oP '(?<=<VersionPrefix>).*?(?=</VersionPrefix>)' "$file")
          IFS='.' read -r major minor patch <<< "$version"
          patch=$((patch + 1))
          new_version="$major.$minor.$patch"
          sed -i "s/<VersionPrefix>$version<\/VersionPrefix>/<VersionPrefix>$new_version<\/VersionPrefix>/" "$file"
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Directory.Build.props
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }}"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    outputs:
      sha: ${{ steps.commit.outputs.sha }}

  # Uploads the bumped commit to the module host as a drop and waits until the host reports it
  # loaded (the job fails if it failed; the host then keeps serving the previous drop).
  # The bot's bump commit is pushed with GITHUB_TOKEN, which doesn't trigger another run.
  deploy:
    needs: bump_version
    runs-on: ubuntu-latest
    environment: production   # MODULE_UPLOAD_KEY lives here; the environment only allows master
    permissions:
      contents: read
    steps:
      - name: Checkout the bumped commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump_version.outputs.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Publish and upload
        shell: pwsh
        env:
          MODULE_UPLOAD_KEY: ${{ secrets.MODULE_UPLOAD_KEY }}
        run: ./deploy.ps1
