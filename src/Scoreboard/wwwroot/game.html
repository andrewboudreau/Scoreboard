<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Game — MDL Scoreboard</title>
    <link rel="stylesheet" href="/_content/Scoreboard/stats.css?v={{v}}">
    <script src="/_content/Scoreboard/stats-core.js?v={{v}}"></script>
    <script src="/_content/Scoreboard/insights.js?v={{v}}"></script>
</head>
<body>
    <div class="container">
        <div class="topbar">
            <a href="/Scoreboard/stats">&larr; Stats</a>
            <a href="/Scoreboard/">Scoreboard</a>
        </div>
        <div id="loading" class="loading">Loading game…</div>
        <div id="error" class="error" hidden></div>
        <div id="results" hidden></div>
    </div>

    <script>
        const { esc, formatDate, formatTime, teamChip } = Stats;
        const id = new URLSearchParams(location.search).get('id');
        let game = null;
        let lastJson = '';

        load();

        async function load() {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            try {
                if (!id) throw new Error('No game specified.');
                // "<id>~2" is an earlier night inside an old saved game (see Stats.gamesFromDoc)
                const docId = id.split('~')[0];
                const [res, current] = await Promise.all([
                    fetch(`/Scoreboard/api/games/${encodeURIComponent(docId)}`),
                    fetch('/Scoreboard/api/current-game').then(r => r.status === 200 ? r.json() : null).catch(() => null)
                ]);
                if (!res.ok) throw new Error(res.status === 404 ? 'Game not found.' : `Error ${res.status}`);
                const json = await res.text();
                const live = current?.id === id && isRecent(current);
                if (json !== lastJson) {
                    lastJson = json;
                    game = Stats.gamesFromDoc(JSON.parse(json)).find(g => g.id === id);
                    if (!game) throw new Error('Game not found.');
                    render(live);
                }
                loading.hidden = true;
                document.getElementById('results').hidden = false;
                // Follow along while the game is being played
                if (live) setTimeout(load, 15000);
            } catch (e) {
                loading.hidden = true;
                error.hidden = false;
                error.textContent = e.message;
            }
        }

        // The current game counts as live if it was updated in the last 3 hours
        function isRecent(raw) {
            const t = Date.parse(raw.lastUpdated || '');
            return Number.isFinite(t) && Date.now() - t < 3 * 3600 * 1000;
        }

        function render(live) {
            const g = game;
            const [n1, n2] = g.names;
            document.title = `${n1} ${g.final[0]}–${g.final[1]} ${n2} · ${formatDate(g.date)}`;
            const result = g.winner === 0 ? 'Tied' : `${esc(g.names[g.winner - 1])} ${live ? 'leads' : 'won'} by ${g.margin}`;

            let html = `
                <div class="card hero">
                    <div class="date">${formatDate(g.date, { weekday: 'long', month: 'long', day: 'numeric' })}
                        ${live ? ' · <span class="badge live">LIVE</span>' : ''}</div>
                    <div class="scoreline">
                        <div class="team">${teamChip(1, n1)}<div class="big ${g.winner === 2 ? 'lost' : ''}">${g.final[0]}</div></div>
                        <div class="dash">–</div>
                        <div class="team">${teamChip(2, n2)}<div class="big ${g.winner === 1 ? 'lost' : ''}">${g.final[1]}</div></div>
                    </div>
                    <div class="result">${result}</div>
                    <div class="actions">
                        <button class="btn" id="share-btn">Share result</button>
                    </div>
                </div>`;

            html += quartersCard(g) + chartCard(g) + boxScore(g) + playByPlay(g);
            document.getElementById('results').innerHTML = html;
            document.getElementById('share-btn').addEventListener('click', async e => {
                const outcome = await Stats.share(Stats.shareText(g, location.href));
                if (outcome === 'copied') {
                    e.target.textContent = 'Copied!';
                    setTimeout(() => e.target.textContent = 'Share result', 1500);
                }
            });
        }

        function quartersCard(g) {
            if (!g.quarters.length) return '';
            const qs = g.quarters;
            const cell = (q, t) => {
                const won = q.points[t] > q.points[1 - t];
                return `<td class="${won ? 'best' : 'dim'}">${q.points[t]}</td>`;
            };
            const row = t => `<tr>
                <td>${teamChip(t + 1, g.names[t])}</td>
                ${qs.map(q => cell(q, t)).join('')}
                ${g.unfinished ? `<td class="dim">${g.final[t] - qs[qs.length - 1].total[t]}</td>` : ''}
                <td class="best">${g.final[t]}</td></tr>`;
            return `
                <div class="card">
                    <h2>Quarters</h2>
                    <div class="table-wrap"><table>
                        <thead><tr><th></th>${qs.map((_, i) => `<th>Q${i + 1}</th>`).join('')}${g.unfinished ? '<th>Now</th>' : ''}<th>Final</th></tr></thead>
                        <tbody>${row(0)}${row(1)}</tbody>
                    </table></div>
                </div>`;
        }

        function chartCard(g) {
            const svg = Stats.chartSvg(g);
            if (!svg) return '';
            const f = Stats.flow(g);
            const lead = t => f.biggest[t] ? `${f.biggest[t]}` : '0';
            const run = Insights.runs(g);
            return `
                <div class="card">
                    <h2>Score</h2>
                    ${svg}
                    <div class="legend"><span><i></i>${esc(g.names[0])}</span><span><i class="t2"></i>${esc(g.names[1])}</span></div>
                    <div class="facts" style="margin-top:12px">
                        <div><div class="value">${f.leadChanges}</div><div class="label">Lead changes</div></div>
                        <div><div class="value">${lead(0)}</div><div class="label">${esc(g.names[0])} biggest lead</div></div>
                        <div><div class="value">${lead(1)}</div><div class="label">${esc(g.names[1])} biggest lead</div></div>
                    </div>
                    ${run && run.n >= 4 ? `<div class="note">Longest run: ${teamChip(run.team, g.names[run.team - 1])} scored ${run.n} straight, reaching ${run.at[0]}–${run.at[1]}.</div>` : ''}
                    ${g.scoreEvents.length < 2 ? '<div class="note">Team scores at the end of each quarter.</div>' : ''}
                </div>`;
        }

        function boxScore(g) {
            if (!g.players.length) return '';
            const team = t => {
                const list = g.players.filter(p => p.team === t);
                if (!list.length) return '';
                if (!g.tracked && !g.partial) {
                    return `<div class="box"><h3>${teamChip(t, g.names[t - 1])}</h3>
                        <div class="played">${list.map(p => `<span>${esc(p.name)}</span>`).join('')}</div></div>`;
                }
                const sorted = [...list].sort((a, b) => b.points - a.points || a.name.localeCompare(b.name));
                const max = Math.max(1, ...sorted.map(p => p.points));
                const top = sorted[0].points;
                const other = g.unattributed[t - 1];
                return `<div class="box"><h3>${teamChip(t, g.names[t - 1])}</h3>
                    <table><tbody>
                        ${sorted.map(p => `<tr>
                            <td class="name">${esc(p.name)}</td>
                            <td><span class="share-bar ${t === 2 ? 't2' : ''}" style="width:${Math.round(60 * p.points / max)}px"></span><span class="${p.points === top && top > 0 ? 'best' : ''}">${p.points}</span></td>
                        </tr>`).join('')}
                        ${other ? `<tr><td class="dim">Not credited</td><td class="dim">${other}</td></tr>` : ''}
                    </tbody></table></div>`;
            };
            return `
                <div class="card">
                    <h2>${g.tracked ? 'Box score' : 'Who played'}</h2>
                    <div class="box-grid">${team(1)}${team(2)}</div>
                    ${g.partial ? `<div class="note">Only ${g.final[0] + g.final[1] - g.unattributed[0] - g.unattributed[1]} of ${g.final[0] + g.final[1]} points were credited to players, so season player stats treat this as a team-scores game.</div>`
                        : !g.tracked ? '<div class="note">Player points weren’t tracked this game, just team scores.</div>' : ''}
                </div>`;
        }

        function playByPlay(g) {
            const items = g.events.filter(e => e.type === 'score' || e.type === 'period_end' || e.type === 'score_set');
            if (!items.length) return '';
            const byId = new Map(g.raw.players?.map(p => [p.id, p.name]) || []);
            let q = 0;
            const lis = items.map(e => {
                const s = Array.isArray(e.scores) ? `${e.scores[0]}–${e.scores[1]}` : '';
                if (e.type === 'period_end') {
                    q++;
                    return `<li class="q"><span class="t">${formatTime(e.ts)}</span><span class="who">End of Q${e.period || q}</span><span class="s">${s}</span></li>`;
                }
                if (e.type === 'score_set') {
                    return `<li><span class="t">${formatTime(e.ts)}</span><span class="who dim">Score set</span><span class="s">${s}</span></li>`;
                }
                const who = (e.playerId && byId.get(e.playerId)) || e.player || g.names[(e.team || 1) - 1];
                return `<li><span class="t">${formatTime(e.ts)}</span><span class="who">${teamChip(e.team === 2 ? 2 : 1, '')} ${esc(who)} <span class="dim">${e.action === 'decrement' ? '−1' : '+1'}</span></span><span class="s">${s}</span></li>`;
            });
            return `
                <div class="card">
                    <details>
                        <summary>Play-by-play (${items.length})</summary>
                        <ul class="pbp">${lis.join('')}</ul>
                    </details>
                </div>`;
        }
    </script>
</body>
</html>
