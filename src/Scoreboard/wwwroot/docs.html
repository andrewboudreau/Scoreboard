# Scoreboard Documentation

A basketball scoreboard for the weekly pickup game. Every phone, tablet or laptop that opens it shows the same teams, score and history: the server keeps one shared copy of everything, and each device saves its changes there automatically.

There is no login. Anyone with the URL can view and edit, so share it only with the group.

## How It Works

### Architecture

```mermaid
graph LR
    Host["ASP.NET Host"] -->|loads| Module["Scoreboard Module"]
    Module -->|serves pages| Browser["Scoreboard / Stats / Game pages"]
    Browser -->|GET / PUT JSON| API["Server API"]
    API -->|ScoreboardStore| Blob["Azure Blob Storage"]
```

The scoreboard runs in the browser. The server is a small JSON store: the browser sends the roster and each game as whole documents, and every other device picks them up on its next refresh.

- **Saving** — changes are sent within a few seconds. If a save fails (no signal at the gym), a **"Not saved yet, retrying…"** badge appears at the top and the save is retried when the connection comes back.
- **Refreshing** — each device pulls the latest roster and game every 15 seconds, and whenever the app comes back to the foreground.
- **Device settings** — only font sizes and *Keep screen on* are stored on the device.

### Save and refresh

```mermaid
sequenceDiagram
    participant A as Device A
    participant S as Server
    participant B as Device B

    A->>A: Tap score
    A->>S: PUT /api/games/{id} (after ~3s)
    A->>S: PUT /api/current-game {gameId}
    B->>S: GET /api/current-game (every 15s)
    S-->>B: Current game
    B->>B: Show new score
```

## Scoreboard

### Scoring

- **Tap a team score** — +1
- **Long-press a team score** (touch, 0.8s) — −1, never below 0
- **Tap a player** on the left (BLACK) or right (WHITE) — +1 for that player and their team
- **−1 buttons** in Settings — take a point off a team

Every change is recorded in the game's play-by-play.

### Timer

- **Tap** — start or stop
- **Double-tap** — reset to the configured minutes
- **At zero** — the quarter's score is recorded, the buzzer sounds, the timer blinks red and resets

Set the length in Settings (1–60 minutes).

### Quarters

Each recorded quarter shows as a chip under the timer, e.g. `20 - 21` (the running score at the end of the quarter).

- Right after a quarter ends, its chip is highlighted: points added before the timer is started again still count toward that quarter (handy for a last-second basket).
- **Tap a chip** to set that quarter to the current score.
- **Clear Periods** in Settings removes all quarters and the play-by-play (the score stays).

### Games without player tracking

If nobody is tapping baskets, just keep the team score. At the top of Settings, under **Quarter score**:

- **End Q*n* at this score** — type both teams' scores and end the quarter
- **Just set the score** — fix the score without ending a quarter

These games still count for team records and for each player's games played, wins and +/-.

### New game

**New Game** in Settings keeps the current game in history and starts a fresh one at 0–0. Points and quarters reset; the teams stay.

### Results link

**Copy Results Link** copies a link to this game's page (`/Scoreboard/game?id=…`) to paste in the group chat.

### Display

- **Fullscreen** button (bottom right)
- **Score / Timer / Player button size** sliders in Settings
- **Keep screen on** stops the device from sleeping (if the browser supports it)

## Teams

Open the teams panel with the people icon. It fills the screen on phones.

### Picking teams

Each player row has a **BLACK / Out / WHITE** toggle. The chips at the top count each team and get an orange outline when the teams differ by more than one.

- **All out** — mark everyone out at the start of the week, then tap in whoever shows up
- **Balance** — split everyone who's in into the most even teams, based on how past games went (see *Player impact* below). It leaves the teams alone if they're already within half a point.
- **Shuffle** — randomly split everyone who's in into even teams
- **📌 Pin** — keep a player on their team when balancing or shuffling (pins are only on this device)
- **Add a player** — type a name at the bottom; they join the smaller team

Under the counts, **Prediction** shows the favourite and their win chance for the current teams.

While the game is on, the **−/+** next to each player who's in adjusts their points (and their team's score).

### Sharing the teams

**Share** sends the teams to the group chat (share sheet on phones, clipboard on computers):

```text
🏀 Teams for Sat, Nov 14

⚫ BLACK (5)
Adams
Baker
...

⚪ WHITE (5)
Foster
Garcia
...
```

### Editing players

Tap **Edit** to switch each row to:

- **Photo** — pick a picture; it's cropped to a square avatar
- **Rename**
- **Delete**

Tap **Done** when finished. Team names can be edited by tapping them on the scoreboard or in Settings.

## Stats

Open **Stats & History** from Settings, or go to `/Scoreboard/stats`. It has four tabs (**Overview**, **Players**, **Insights**, **Games**); the range filter applies to all of them except the impact model, which always uses every game.

- **Range** — Last 10, This year, All time
- **Head to head** — wins for each team, ties, and the current streak
- **Tiles** — average score, average margin, closest game, biggest win
- **Comebacks** — games won after trailing at half
- **By quarter** — average points per quarter and quarters won
- **Players** — games played, W-L, win %, +/- (the team's average margin), points per game and high. Tap a column to sort; tap a player for their game log.
- **Games** — every game by month, marked *Player stats* or *Team scores*

Team results, records and +/- use every game. Points per game and high only use games where baskets were credited to players.

### Insights

- **Player impact** — a ridge regression on final margins ("adjusted plus-minus"): every game says *BLACK margin = sum of BLACK players' impact − sum of WHITE players' impact*. Solving across all games gives each player's points added per game versus an average player, separating them from who they happened to play with. It only needs who played and the final score, so team-score-only games count fully. Recent games weigh more (half-life 25 games), players with few games are shrunk toward 0, and margins are capped at 15.
- **Back-test** — each past game is predicted using only the games before it; the page reports how often it picked the winner and the typical miss, so you can judge how much to trust it.
- **Next game** (Overview) — win chances for the teams currently set on the scoreboard.
- **Best duos / Rivalries** — average margin as teammates, and the most one-sided records as opponents (3+ games).
- **Scoring** (tracked games) — share of team points, game-to-game swing, share scored in Q4, longest run of team baskets.
- **Points per game** trend and **How close are the games** distribution.
- **Showing up** (Players tab) — attendance and current streak.

The player sheet adds impact rank, points by quarter, best teammates and toughest opponents.

### Game page

Each game has its own page (`/Scoreboard/game?id=…`):

- Final score and **Share result** (a text summary with quarters and top scorers)
- Quarter-by-quarter table
- Score chart with lead changes and biggest leads
- **Box score**, or **Who played** for games with only team scores. Points not credited to anyone show as *Not credited*.
- Play-by-play

While a game is being played the page shows **LIVE** and updates every 15 seconds.

## Data

### Game document

Each game is one JSON document:

```json
{
  "id": "game-2026-11-14-970d",
  "version": 1,
  "weekDate": "2026-11-14",
  "team1": { "name": "BLACK", "score": 44 },
  "team2": { "name": "WHITE", "score": 42 },
  "period": 4,
  "periodScores": ["20 - 21", "34 - 30", "44 - 42"],
  "timerMinutes": 5,
  "players": [
    { "id": 1794637552563, "name": "Adams", "team": "1", "active": true, "points": 9 }
  ],
  "events": [
    { "ts": "2026-11-14T19:05:53Z", "type": "score", "team": 1, "player": "Adams",
      "playerId": 1794637552563, "action": "increment", "scores": [1, 0], "timer": 300 },
    { "ts": "2026-11-14T19:20:00Z", "type": "period_end", "scores": [20, 21], "period": 1 }
  ],
  "lastUpdated": "2026-11-14T20:30:00Z"
}
```

- Teams are **BLACK** (`team1`, players with `"team": "1"`) and **WHITE** (`team2`, `"team": "2"`). Players with `"active": false` are out.
- `periodScores` are running totals at the end of each quarter.
- Event types: `score` (a tap; `player` is null for a team-score tap), `score_set` (score typed in), `period_end`.

### Roster

```json
{
  "team1Name": "BLACK",
  "team2Name": "WHITE",
  "players": [
    { "id": 1742075931014, "name": "Andrew", "team": "2", "active": true,
      "imageUrl": "/Scoreboard/api/players/1742075931014/image?v=1731600000" }
  ]
}
```

### Storage

```text
{container}/{dataFolder}/
├── roster.json
├── current-game.json      # { "gameId": "..." }
├── games/{gameId}.json
└── players/{id}.png       # 96×96 avatars
```

`dataFolder` is `BlobStorage:DataFolder` if configured. Otherwise it's the folder of the old group with the most games (so history from earlier versions carries over), or `main` on a fresh install.

### Upgrading from older versions

Older versions kept the roster and current game in each browser. The first time an old device opens this version, it uploads what it has — the roster only if the server has none yet, the game only if the server doesn't already have it — and then clears the old browser data.

## API Reference

All endpoints are under `/Scoreboard/api`. No authentication. JSON bodies are limited to 1 MB; game ids must be letters, digits, `-` or `_` (up to 80).

| Method | Path | Description |
|--------|------|-------------|
| GET | `/info` | Version, data folder, number of games, whether a roster is saved |
| GET | `/roster` | The roster. Before one is saved, returns the bundled default players with `"seeded": true` |
| PUT | `/roster` | Replace the roster |
| GET | `/current-game` | The current game document, or `204` if there is none |
| PUT | `/current-game` | Set the current game: `{ "gameId": "game-2026-11-14-970d" }` |
| GET | `/games` | All saved games, as one JSON array |
| GET | `/games/{id}` | One game, or `404` |
| PUT | `/games/{id}` | Save a game |
| POST | `/players/{id}/image` | Upload a photo (`multipart/form-data`, field `image`, max 10 MB). Returns `{ "imageUrl": "..." }` |
| GET | `/players/{id}/image` | The player's photo (`image/png`), or `404` |

`PUT` endpoints return `204` on success, `400` if the body isn't JSON (or the id is invalid), and `413` if it's over 1 MB.

                    }
                    const highlighted = lang && hljs.getLanguage(lang)

                    text = text || '';
                    const id = text.replace(/<[^>]+>/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
                    return `<h${level} id="${id}">${text}</h${level}>`;

        headings.forEach(h => {
            const level = parseInt(h.tagName[1]);
            if (level === 1) return; // skip the page title
            const cls = level === 3 ? ' class="sub"' : '';
            navHtml += `<a href="#${h.id}"${cls}>${h.textContent}</a>`;
        });

        sidebar.innerHTML = navHtml;

        // ── Highlight active nav on scroll ──
        const navLinks = sidebar.querySelectorAll('a');
        const headingEls = Array.from(headings).filter(h => h.tagName !== 'H1');

        function updateActive() {
            let current = '';
            for (const h of headingEls) {
                if (h.getBoundingClientRect().top <= 80) current = h.id;
            }
            navLinks.forEach(a => {
                a.classList.toggle('active', a.getAttribute('href') === '#' + current);
            });
        }

        window.addEventListener('scroll', updateActive, { passive: true });
        updateActive();
