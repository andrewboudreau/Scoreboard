<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MDL Scoreboard</title>
    <link rel="stylesheet" href="/_content/Scoreboard/styles.css?v={{v}}">
    <script src="/_content/Scoreboard/stats-core.js?v={{v}}"></script>
    <script src="/_content/Scoreboard/insights.js?v={{v}}"></script>
    <script src="/_content/Scoreboard/tour.js?v={{v}}"></script>
    <script src="/_content/Scoreboard/app.js?v={{v}}"></script>
</head>
<body>
    <div id="sync-status" role="status" hidden>Not saved yet, retrying…</div>
    <audio id="alarm" src="/_content/Scoreboard/audio/buzzer.mp3"></audio>

    <div class="scoreboard">
        <div class="team-players-list" id="team1-players-display">
            <!-- Team 1 players will be displayed here -->
        </div>
        <div class="team-players-list" id="team2-players-display">
            <!-- Team 2 players will be displayed here -->
        </div>
        <div class="scores-container">
            <div class="scores">
                <div class="team">
                    <div class="team-name" contenteditable="true">BLACK</div>
                    <div class="score" id="score-team1">0</div>
                </div>
                <div class="team">
                    <div class="team-name" contenteditable="true">WHITE</div>
                    <div class="score" id="score-team2">0</div>
                </div>
            </div>
        </div>
        <div class="timer-container">
            <div class="timer" id="timer">15:00</div>
            <div class="score-history" id="score-history"></div>
        </div>
        <div class="control-buttons">
<button id="players-btn" class="control-btn" title="Teams">
                <img src="/_content/Scoreboard/icons/players.svg" alt="Players Icon" width="24" height="24">
            </button>
            <button id="settings-btn" class="control-btn">
                <img src="/_content/Scoreboard/icons/settings.svg" alt="Settings Icon" width="24" height="24">
            </button>
            <button id="fullscreen-btn" class="control-btn">
                <img src="/_content/Scoreboard/icons/fullscreen.svg" alt="Fullscreen Icon" width="24" height="24">
            </button>
        </div>

        <div id="players-panel" class="side-panel teams-panel">
            <div class="teams-header">
                <div class="teams-titlebar">
                    <h2 id="teams-title" class="teams-title">Teams</h2>
                    <button id="teams-help-btn" class="titlebar-btn help-btn" aria-label="How this screen works" title="How this screen works">?</button>
                    <button id="edit-roster-btn" class="titlebar-btn" title="Rename, add photos, or delete players">Edit</button>
                    <button id="close-teams-btn" class="titlebar-btn close-btn" aria-label="Close" title="Close">&#x2715;</button>
                </div>
                <div class="teams-summary">
                    <div id="team-counts" class="team-counts"></div>
                    <div id="team-prediction" class="team-prediction" hidden></div>
                </div>
                <div class="teams-actions">
                    <button id="balance-btn" title="Split everyone who's in into the most even teams based on past games (pinned players stay put)">Balance</button>
                    <button id="shuffle-btn" title="Randomly split everyone who's in into even teams (pinned players stay put)">Shuffle</button>
                    <button id="all-out-btn" title="Mark everyone out, then tap in whoever shows up">All out</button>
                    <button id="share-teams-btn" title="Send the teams to the group chat">Share</button>
                </div>
                <p class="teams-hint" id="teams-hint">&#x1F4CC; keeps a player on their team when you Balance or Shuffle</p>
            </div>
            <div id="players-list" class="roster-list"></div>
            <div class="add-player">
                <input type="text" id="player-name-input" placeholder="Add a player...">
                <button id="add-player-btn">Add</button>
            </div>
            <input type="file" id="player-photo-input" accept="image/*" hidden>
        </div>

        <div id="settings-panel" class="side-panel">
            <div class="settings-group quarter-entry">
                <label>Quarter score <span class="hint">for games without player tracking</span></label>
                <div class="quarter-inputs">
                    <label><span id="q-team1-label">BLACK</span><input type="number" inputmode="numeric" id="q-team1" min="0" max="999"></label>
                    <label><span id="q-team2-label">WHITE</span><input type="number" inputmode="numeric" id="q-team2" min="0" max="999"></label>
                </div>
                <button id="end-quarter-btn">End Q1 at this score</button>
                <button id="set-score-btn">Just set the score</button>
            </div>
            <div class="settings-group">
                <label for="timer-minutes">Timer (minutes)</label>
                <input type="number" id="timer-minutes" min="1" max="60" value="10">
                <button id="set-timer-btn">Set Timer</button>
            </div>
            <div class="settings-group">
                <label for="team1-name">Teams</label>
                <div class="team-settings">
                    <input type="text" id="team1-name" value="BLACK">
                    <button class="decrement-btn" id="team1-decrement">-1</button>
                </div>
                <div class="team-settings">
                    <input type="text" id="team2-name" value="WHITE">
                    <button class="decrement-btn" id="team2-decrement">-1</button>
                </div>
            </div>
            <div class="settings-group">
                <button id="reset-scores-btn" title="Saves this game to history and starts a fresh one">New Game</button>
                <button id="reset-history-btn">Clear Periods</button>
                <button id="test-buzzer-btn">Test Buzzer</button>
                <button id="simulate-timer-end-btn">Test Timer End</button>
            </div>
            <div class="settings-group">
                <label for="score-font-size">Score Font Size: <span id="score-font-size-value">10</span>rem</label>
                <input type="range" id="score-font-size" min="5" max="25" value="10" step="0.5">
            </div>
            <div class="settings-group">
                <label for="timer-font-size">Timer Font Size: <span id="timer-font-size-value">14</span>rem</label>
                <input type="range" id="timer-font-size" min="6" max="30" value="14" step="0.5">
            </div>
            <div class="settings-group">
                <label for="player-button-size">Player Button Size: <span id="player-button-size-value">15</span>px</label>
                <input type="range" id="player-button-size" min="10" max="50" value="15" step="1">
            </div>
            <div class="settings-group">
                <label>
                    <input type="checkbox" id="keep-screen-on"> Keep screen on (prevents device sleep)
                </label>
            </div>
            <div class="settings-group">
                <label>Results</label>
                <button id="share-game-btn">Copy Results Link</button>
                <button id="stats-btn">Stats &amp; History</button>
            </div>
        </div>

    </div>
</body>
</html>
