<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Stats — MDL Scoreboard</title>
    <link rel="stylesheet" href="/_content/Scoreboard/stats.css?v={{v}}">
    <script src="/_content/Scoreboard/stats-core.js?v={{v}}"></script>
</head>
<body>
    <div class="container">
        <div class="topbar">
            <a href="/Scoreboard/">&larr; Scoreboard</a>
            <h1>Stats</h1>
            <span style="width:90px"></span>
        </div>

        <div class="segmented" id="range">
            <button data-range="10">Last 10</button>
            <button data-range="year">This year</button>
            <button data-range="all">All time</button>
        </div>

        <div id="loading" class="loading">Loading games…</div>
        <div id="error" class="error" hidden></div>
        <div id="content" hidden></div>
    </div>

    <div class="sheet-backdrop" id="sheet" hidden>
        <div class="sheet" id="sheet-body"></div>
    </div>

    <script>
        const { esc, formatDate, signed, teamChip } = Stats;
        let allGames = [];
        let range = localStorage.getItem('statsRange') || '10';
        let sort = { key: 'gp', desc: true };

        const content = document.getElementById('content');
        const sheet = document.getElementById('sheet');

        (async () => {
            try {
                allGames = await Stats.loadGames();
                document.getElementById('loading').hidden = true;
                content.hidden = false;
                render();
            } catch (e) {
                document.getElementById('loading').hidden = true;
                const err = document.getElementById('error');
                err.hidden = false;
                err.textContent = e.message;
            }
        })();

        document.querySelectorAll('#range button').forEach(b => b.addEventListener('click', () => {
            range = b.dataset.range;
            localStorage.setItem('statsRange', range);
            render();
        }));

        sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

        function gamesInRange() {
            if (range === '10') return allGames.slice(0, 10);
            if (range === 'year') {
                const year = String(new Date().getFullYear());
                return allGames.filter(g => g.date.startsWith(year));
            }
            return allGames;
        }

        // Team names as stored on the latest game (they're BLACK and WHITE)
        function teamNames() {
            return allGames[0]?.names || ['BLACK', 'WHITE'];
        }

        function render() {
            document.querySelectorAll('#range button').forEach(b => b.classList.toggle('selected', b.dataset.range === range));
            const games = gamesInRange();
            if (!games.length) {
                content.innerHTML = `<div class="empty">No games ${range === 'year' ? 'this year' : 'yet'}.<br>Games show up here once you keep score.</div>`;
                return;
            }
            content.innerHTML = summaryHtml(games) + quartersHtml(games) + playersHtml(games) + historyHtml(games) +
                `<div class="footer"><a href="/Scoreboard/">MDL Scoreboard</a></div>`;
            bindPlayers(games);
        }

        function summaryHtml(games) {
            const s = Stats.summarize(games);
            const [n1, n2] = teamNames();
            const decided = s.wins[0] + s.wins[1];
            const pct = decided ? Math.round(100 * s.wins[0] / decided) : 50;
            const avg = i => (s.points[i] / s.games).toFixed(1);
            const tracked = games.filter(g => g.tracked).length;

            const streak = s.streak.count > 1
                ? `${teamChip(s.streak.team, s.streak.team === 1 ? n1 : n2)} won ${s.streak.count} straight`
                : s.streak.count === 1 ? `${teamChip(s.streak.team, s.streak.team === 1 ? n1 : n2)} won the last game` : 'Last game was a tie';

            const gameTile = (label, g, sub) => g ? `
                <a class="tile link" href="/Scoreboard/game?id=${encodeURIComponent(g.id)}" style="color:inherit;text-decoration:none">
                    <div class="label">${label}</div>
                    <div class="value">${g.final[0]}–${g.final[1]}</div>
                    <div class="sub">${sub(g)}</div>
                </a>` : '';

            return `
                <div class="card">
                    <h2>Head to head · ${s.games} game${s.games === 1 ? '' : 's'}</h2>
                    <div class="record">
                        <div class="side">${teamChip(1, n1)}<div class="wins">${s.wins[0]}</div></div>
                        <div class="bar"><div style="width:${pct}%"></div></div>
                        <div class="side">${teamChip(2, n2)}<div class="wins">${s.wins[1]}</div></div>
                    </div>
                    <div class="record-sub">${s.ties ? `${s.ties} tie${s.ties === 1 ? '' : 's'} · ` : ''}${streak}</div>
                </div>
                <div class="tiles">
                    <div class="tile">
                        <div class="label">Avg score</div>
                        <div class="value">${avg(0)}–${avg(1)}</div>
                        <div class="sub">${esc(n1)}–${esc(n2)}</div>
                    </div>
                    <div class="tile">
                        <div class="label">Avg margin</div>
                        <div class="value">${(games.reduce((t, g) => t + g.margin, 0) / s.games).toFixed(1)}</div>
                        <div class="sub">points per game</div>
                    </div>
                    ${gameTile('Closest game', s.closest, g => `${formatDate(g.date)} · by ${g.margin}`)}
                    ${gameTile('Biggest win', s.biggest, g => `${formatDate(g.date)} · by ${g.margin}`)}
                </div>
                ${s.comebacks.length ? `
                <div class="card">
                    <h2>Comebacks · won after trailing at half</h2>
                    ${s.comebacks.slice(0, 5).map(c => `
                        <a href="/Scoreboard/game?id=${encodeURIComponent(c.game.id)}" style="display:flex;justify-content:space-between;padding:6px 0;color:inherit;text-decoration:none">
                            <span>${teamChip(c.game.winner, c.game.names[c.game.winner - 1])} down ${c.deficit} at half</span>
                            <span class="dim">${formatDate(c.game.date)} · ${c.game.final[0]}–${c.game.final[1]}</span>
                        </a>`).join('')}
                </div>` : ''}
                ${tracked < games.length ? `<div class="card note" style="margin-top:0">
                    Player points were tracked in ${tracked} of ${games.length} games. Team results, records and +/- use every game; points per game only use the tracked ones.
                </div>` : ''}`;
        }

        function quartersHtml(games) {
            const s = Stats.summarize(games);
            const rows = s.quarters.slice(0, 4);
            if (!rows.length) return '';
            const [n1, n2] = teamNames();
            return `
                <div class="card">
                    <h2>By quarter</h2>
                    <div class="table-wrap"><table>
                        <thead><tr><th></th><th>${esc(n1)} avg</th><th>${esc(n2)} avg</th><th>Won</th></tr></thead>
                        <tbody>${rows.map((q, i) => `
                            <tr>
                                <td>Q${i + 1} <span class="dim">(${q.games})</span></td>
                                <td>${(q.points[0] / q.games).toFixed(1)}</td>
                                <td>${(q.points[1] / q.games).toFixed(1)}</td>
                                <td>${q.won[0]}–${q.won[1]}</td>
                            </tr>`).join('')}
                        </tbody>
                    </table></div>
                    <div class="note">Points scored in each quarter. "Won" is quarters won by ${esc(n1)}–${esc(n2)}.</div>
                </div>`;
        }

        const COLUMNS = [
            { key: 'name', label: 'Player', fmt: r => esc(r.name), cls: 'name' },
            { key: 'gp', label: 'GP', fmt: r => r.gp },
            { key: 'record', label: 'W-L', fmt: r => `${r.wins}-${r.losses}${r.ties ? `-${r.ties}` : ''}`, value: r => r.wins - r.losses },
            { key: 'winPct', label: 'Win%', fmt: r => Math.round(r.winPct * 100) },
            { key: 'avgPlusMinus', label: '+/-', fmt: r => signed(r.avgPlusMinus, 1) },
            { key: 'ppg', label: 'PPG', fmt: r => r.ppg === null ? '<span class="dim">–</span>' : r.ppg.toFixed(1) },
            { key: 'high', label: 'High', fmt: r => r.high ? r.high.points : '<span class="dim">–</span>', value: r => r.high?.points ?? -1 }
        ];

        function sortedPlayers(games) {
            const col = COLUMNS.find(c => c.key === sort.key);
            const val = r => col.value ? col.value(r) : r[col.key] ?? -Infinity;
            return Stats.players(games).sort((a, b) => {
                const va = val(a), vb = val(b);
                const cmp = typeof va === 'string' ? va.localeCompare(vb) : va - vb;
                return (sort.desc ? -cmp : cmp) || b.gp - a.gp || a.name.localeCompare(b.name);
            });
        }

        function playersHtml(games) {
            const rows = sortedPlayers(games);
            if (!rows.length) return '';
            return `
                <div class="card">
                    <h2>Players</h2>
                    <div class="table-wrap"><table id="players-table">
                        <thead><tr>${COLUMNS.map(c => `<th class="sortable${sort.key === c.key ? ' sorted' : ''}" data-key="${c.key}">${c.label}${sort.key === c.key ? (sort.desc ? ' ▾' : ' ▴') : ''}</th>`).join('')}</tr></thead>
                        <tbody>${rows.map(r => `<tr class="clickable" data-id="${esc(r.id)}">${COLUMNS.map(c => `<td class="${c.cls || ''}">${c.fmt(r)}</td>`).join('')}</tr>`).join('')}</tbody>
                    </table></div>
                    <div class="note">GP, W-L, Win% and +/- (team's average margin) count every game played. PPG and High only count games where player points were tracked. Tap a player for their games.</div>
                </div>`;
        }

        function bindPlayers(games) {
            const table = document.getElementById('players-table');
            if (!table) return;
            table.querySelectorAll('th.sortable').forEach(th => th.addEventListener('click', () => {
                const key = th.dataset.key;
                sort = { key, desc: sort.key === key ? !sort.desc : key !== 'name' };
                render();
            }));
            const players = Stats.players(games);
            table.querySelectorAll('tr.clickable').forEach(tr => tr.addEventListener('click', () =>
                openPlayer(players.find(p => p.id === tr.dataset.id))));
        }

        function openPlayer(p) {
            if (!p) return;
            const [n1, n2] = teamNames();
            document.getElementById('sheet-body').innerHTML = `
                <div class="topbar">
                    <h1>${esc(p.name)}</h1>
                    <button class="link-btn" onclick="closeSheet()">Done</button>
                </div>
                <div class="tiles">
                    <div class="tile"><div class="label">Record</div><div class="value">${p.wins}-${p.losses}</div><div class="sub">${Math.round(p.winPct * 100)}% wins${p.ties ? ` · ${p.ties} tied` : ''}</div></div>
                    <div class="tile"><div class="label">+/- per game</div><div class="value">${signed(p.avgPlusMinus, 1)}</div><div class="sub">team margin</div></div>
                    <div class="tile"><div class="label">Points per game</div><div class="value">${p.ppg === null ? '–' : p.ppg.toFixed(1)}</div><div class="sub">${p.trackedGp} tracked game${p.trackedGp === 1 ? '' : 's'}</div></div>
                    <div class="tile"><div class="label">High</div><div class="value">${p.high ? p.high.points : '–'}</div><div class="sub">${p.high ? formatDate(p.high.game.date) : 'no tracked games'}</div></div>
                </div>
                <div class="card">
                    <h2>Games · ${p.gp}</h2>
                    <div class="table-wrap"><table>
                        <thead><tr><th>Date</th><th>Team</th><th>Result</th><th>Pts</th></tr></thead>
                        <tbody>${p.log.map(l => `
                            <tr class="clickable" onclick="location.href='/Scoreboard/game?id=${encodeURIComponent(l.game.id)}'">
                                <td>${formatDate(l.game.date)}</td>
                                <td>${teamChip(l.team, l.team === 1 ? n1 : n2)}</td>
                                <td><span class="${l.result === 'W' ? 'win' : 'dim'}">${l.result}</span> ${l.game.final[0]}–${l.game.final[1]}</td>
                                <td>${l.points === null ? '<span class="dim">–</span>' : l.points}</td>
                            </tr>`).join('')}
                        </tbody>
                    </table></div>
                </div>`;
            sheet.hidden = false;
            document.body.style.overflow = 'hidden';
        }

        function closeSheet() {
            sheet.hidden = true;
            document.body.style.overflow = '';
        }

        function historyHtml(games) {
            let html = '<h2 class="month" style="margin-top:20px">Games</h2>';
            let month = '';
            for (const g of games) {
                const m = g.date ? new Date(g.date + 'T12:00:00').toLocaleDateString(undefined, { month: 'long', year: 'numeric' }) : 'Undated';
                if (m !== month) {
                    month = m;
                    html += `<div class="month">${esc(m)}</div>`;
                }
                const cls = t => g.winner === 0 ? '' : g.winner === t ? 'won' : 'lost';
                html += `
                    <a class="game-row" href="/Scoreboard/game?id=${encodeURIComponent(g.id)}">
                        <div class="top">
                            <span class="date">${formatDate(g.date)}</span>
                            ${g.tracked ? '<span class="badge">Player stats</span>' : '<span class="badge team-only">Team scores</span>'}
                        </div>
                        <div class="score">
                            ${teamChip(1, g.names[0])}<span class="n ${cls(1)}">${g.final[0]}</span>
                            <span class="dim">–</span>
                            <span class="n ${cls(2)}">${g.final[1]}</span>${teamChip(2, g.names[1])}
                        </div>
                        ${g.quarters.length ? `<div class="quarters">${g.quarters.map((q, i) => `Q${i + 1} ${q.points[0]}-${q.points[1]}`).join(' · ')}</div>` : ''}
                    </a>`;
            }
            return html;
        }
    </script>
</body>
</html>
