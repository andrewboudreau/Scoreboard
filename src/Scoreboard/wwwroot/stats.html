<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Stats — MDL Scoreboard</title>
    <link rel="stylesheet" href="/_content/Scoreboard/stats.css?v={{v}}">
    <script src="/_content/Scoreboard/stats-core.js?v={{v}}"></script>
    <script src="/_content/Scoreboard/insights.js?v={{v}}"></script>
</head>
<body>
    <div class="container">
        <div class="topbar">
            <a href="/Scoreboard/">&larr; Scoreboard</a>
            <h1>Stats</h1>
            <span style="width:90px"></span>
        </div>

        <nav class="tabs" id="tabs">
            <button data-tab="overview">Overview</button>
            <button data-tab="players">Players</button>
            <button data-tab="insights">Insights</button>
            <button data-tab="games">Games</button>
        </nav>

        <div class="segmented" id="range">
            <button data-range="10">Last 10</button>
            <button data-range="year">This year</button>
            <button data-range="all">All time</button>
        </div>

        <div id="loading" class="loading">Loading games…</div>
        <div id="error" class="error" hidden></div>
        <div id="content" hidden></div>
    </div>

    <div class="sheet-backdrop" id="sheet" hidden>
        <div class="sheet" id="sheet-body"></div>
    </div>

    <script>
        const { esc, formatDate, signed, teamChip } = Stats;
        const TABS = ['overview', 'players', 'insights', 'games'];
        let allGames = [];
        let roster = null;
        let model = null;      // impact model over every game (not just the range)
        let backtest = null;
        let range = localStorage.getItem('statsRange') || '10';
        let tab = TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'overview';
        let sort = { key: 'gp', desc: true };

        const content = document.getElementById('content');
        const sheet = document.getElementById('sheet');

        (async () => {
            try {
                const [games, r] = await Promise.all([
                    Stats.loadGames(),
                    fetch('/Scoreboard/api/roster').then(res => res.ok ? res.json() : null).catch(() => null)
                ]);
                allGames = games;
                roster = r;
                model = Insights.fit(allGames);
                backtest = Insights.backtest(allGames);
                document.getElementById('loading').hidden = true;
                content.hidden = false;
                render();
            } catch (e) {
                document.getElementById('loading').hidden = true;
                const err = document.getElementById('error');
                err.hidden = false;
                err.textContent = e.message;
            }
        })();

        document.querySelectorAll('#range button').forEach(b => b.addEventListener('click', () => {
            range = b.dataset.range;
            localStorage.setItem('statsRange', range);
            render();
        }));
        document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => {
            tab = b.dataset.tab;
            history.replaceState(null, '', '#' + tab);
            render();
            window.scrollTo(0, 0);
        }));

        sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

        function gamesInRange() {
            if (range === '10') return allGames.slice(0, 10);
            if (range === 'year') {
                const year = String(new Date().getFullYear());
                return allGames.filter(g => g.date.startsWith(year));
            }
            return allGames;
        }

        function rangeLabel() {
            return range === '10' ? 'last 10 games' : range === 'year' ? 'this year' : 'all time';
        }

        function render() {
            document.querySelectorAll('#range button').forEach(b => b.classList.toggle('selected', b.dataset.range === range));
            document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('selected', b.dataset.tab === tab));
            const games = gamesInRange();
            if (!games.length) {
                content.innerHTML = `<div class="empty">No games ${range === 'year' ? 'this year' : 'yet'}.<br>Games show up here once you keep score.</div>`;
                return;
            }
            const pages = {
                overview: () => summaryHtml(games) + quartersHtml(games),
                players: () => playersHtml(games),
                insights: () => insightsHtml(games),
                games: () => historyHtml(games)
            };
            content.innerHTML = pages[tab]() + `<div class="footer"><a href="/Scoreboard/">MDL Scoreboard</a></div>`;
            bindPlayers(games);
            bindCharts();
            document.querySelectorAll('#data-check [data-player]').forEach(b => b.addEventListener('click', () =>
                openPlayer({ ...allTimeRow(b.dataset.player), impact: model.impact(b.dataset.player) }, allGames)));
        }

        // ---------------- Overview ----------------
        // Teams are reshuffled every week and the colors are picked at random, so the overview is
        // about the games and the players. BLACK and WHITE only label the two sides of one game.

        function summaryHtml(games) {
            const s = Stats.summarize(games);
            const tracked = games.filter(g => g.tracked).length;
            const avg = v => (v / s.points.decided).toFixed(1);
            const close = games.filter(g => g.margin <= 5).length;

            const gameTile = (label, g, sub) => g ? `
                <a class="tile link" href="/Scoreboard/game?id=${encodeURIComponent(g.id)}" style="color:inherit;text-decoration:none">
                    <div class="label">${label}</div>
                    <div class="value">${Math.max(...g.final)}–${Math.min(...g.final)}</div>
                    <div class="sub">${sub(g)}</div>
                </a>` : '';

            return `
                ${lastGameHtml(games[0])}
                ${matchupHtml()}
                ${formHtml(games)}
                <div class="tiles">
                    ${s.points.decided ? `
                    <div class="tile">
                        <div class="label">Typical final</div>
                        <div class="value">${avg(s.points.winner)}–${avg(s.points.loser)}</div>
                        <div class="sub">winner–loser average</div>
                    </div>` : ''}
                    <div class="tile">
                        <div class="label">Close games</div>
                        <div class="value">${Math.round(100 * close / s.games)}%</div>
                        <div class="sub">${close} of ${s.games} decided by 5 or fewer</div>
                    </div>
                    ${gameTile('Closest game', s.closest, g => `${formatDate(g.date)} · by ${g.margin}`)}
                    ${gameTile('Biggest win', s.biggest, g => `${formatDate(g.date)} · by ${g.margin}`)}
                </div>
                ${s.comebacks.length ? `
                <div class="card">
                    <h2>Comebacks · won after trailing at half</h2>
                    ${s.comebacks.slice(0, 5).map(c => `
                        <a href="/Scoreboard/game?id=${encodeURIComponent(c.game.id)}" class="list-link">
                            <span>${sideChip(c.game, c.game.winner)} down ${c.deficit} at half</span>
                            <span class="dim">${formatDate(c.game.date)} · ${Math.max(...c.game.final)}–${Math.min(...c.game.final)}</span>
                        </a>`).join('')}
                </div>` : ''}
                ${tracked < games.length ? `<div class="card"><div class="note" style="margin-top:0">
                    Player points were tracked in ${tracked} of ${games.length} games. Records, streaks and impact use every game; points per game only use the tracked ones.
                </div></div>` : ''}`;
        }

        // One side of one game: its shirt color that night, named after who was on it
        function sideChip(g, t) {
            return teamChip(t, Stats.teamLabel(g, t));
        }

        function lastGameHtml(g) {
            if (!g) return '';
            const order = g.winner === 2 ? [2, 1] : [1, 2];
            const names = t => g.players.filter(p => p.team === t).map(p => p.name).sort((a, b) => a.localeCompare(b));
            const row = t => `
                <div class="side-row ${g.winner && g.winner !== t ? 'lost' : ''}">
                    <div class="side-who">${sideChip(g, t)}<div class="side-names">${esc(names(t).join(', '))}</div></div>
                    <div class="side-score">${g.final[t - 1]}</div>
                </div>`;
            return `
                <a class="card card-link" href="/Scoreboard/game?id=${encodeURIComponent(g.id)}">
                    <h2>Last game · ${formatDate(g.date)}</h2>
                    ${row(order[0])}${row(order[1])}
                </a>`;
        }

        // Player streaks: who's on a run now, and the longest runs in this range
        function formHtml(games) {
            const rows = Stats.players(games);
            const hot = rows.filter(r => r.streak >= 2).sort((a, b) => b.streak - a.streak || a.name.localeCompare(b.name)).slice(0, 5);
            const longest = rows.filter(r => r.bestStreak?.count >= 2)
                .sort((a, b) => b.bestStreak.count - a.bestStreak.count || a.name.localeCompare(b.name)).slice(0, 5);
            if (!hot.length && !longest.length) return '';
            const when = b => b.count === 1 ? formatDate(b.from.date) : `${formatDate(b.from.date)} – ${formatDate(b.to.date)}`;
            return `
                <div class="card">
                    <h2>Win streaks · ${rangeLabel()}</h2>
                    ${hot.length ? `<div class="subhead">On a roll</div>${hot.map(r => `
                        <div class="list-link"><span>${esc(r.name)}</span><span><b>${r.streak}</b> <span class="dim">straight</span></span></div>`).join('')}` : ''}
                    ${longest.length ? `<div class="subhead">Longest</div>${longest.map(r => `
                        <div class="list-link"><span>${esc(r.name)} <b>${r.bestStreak.count}</b></span><span class="dim">${when(r.bestStreak)}</span></div>`).join('')}` : ''}
                    <div class="note">Games won in a row, counting only the games each player played. Teams change every week, so streaks follow players, not colors.</div>
                </div>`;
        }

        function quartersHtml(games) {
            const s = Stats.summarize(games);
            const rows = s.quarters.slice(0, 4);
            if (!rows.length) return '';
            const h = s.halfLeader;
            return `
                <div class="card">
                    <h2>Where games are won · by quarter</h2>
                    <div class="table-wrap"><table>
                        <thead><tr><th></th><th>Winner avg</th><th>Loser avg</th><th>Winner took it</th></tr></thead>
                        <tbody>${rows.map((q, i) => `
                            <tr>
                                <td>Q${i + 1} <span class="dim">(${q.games})</span></td>
                                <td>${(q.winner / q.games).toFixed(1)}</td>
                                <td>${(q.loser / q.games).toFixed(1)}</td>
                                <td>${Math.round(100 * q.taken / q.games)}%</td>
                            </tr>`).join('')}
                        </tbody>
                    </table></div>
                    <div class="note">Points per quarter for the team that went on to win and the team that lost.${h.games ? ` The team ahead at half won ${h.won} of ${h.games}.` : ''}</div>
                </div>`;
        }

        // Prediction for the teams currently set on the scoreboard
        function matchupHtml() {
            if (!roster || !model || model.n < 3) return '';
            const playing = (roster.players || []).filter(p => p.active !== false && (p.team === '1' || p.team === '2'));
            const t1 = playing.filter(p => p.team === '1'), t2 = playing.filter(p => p.team === '2');
            if (!t1.length || !t2.length) return '';
            const { margin, p1 } = Insights.predict(model, t1.map(p => p.id), t2.map(p => p.id));
            const pct = Math.round(p1 * 100);
            // Name each side after its highest-impact player; the color is just tonight's shirts
            const lead = list => [...list].sort((a, b) => model.impact(b.id) - model.impact(a.id))[0].name;
            const sides = [`Team ${lead(t1)}`, `Team ${lead(t2)}`];
            const fav = Math.abs(margin) < 0.5 ? 'Dead even' : `${esc(margin > 0 ? sides[0] : sides[1])} by ${Math.abs(margin).toFixed(1)}`;
            const names = list => list.map(p => esc(p.name)).sort().join(', ');
            return `
                <div class="card" id="matchup">
                    <h2>Next game · current teams</h2>
                    <div class="side-row">
                        <div class="side-who">${teamChip(1, sides[0])}<div class="side-names">${names(t1)}</div></div>
                        <div class="side-score">${pct}%</div>
                    </div>
                    <div class="side-row">
                        <div class="side-who">${teamChip(2, sides[1])}<div class="side-names">${names(t2)}</div></div>
                        <div class="side-score">${100 - pct}%</div>
                    </div>
                    <div class="note">Predicted: ${fav}. Win chances from the impact model (Insights tab). Tap <b>Balance</b> in the Teams panel for the most even split.</div>
                </div>`;
        }

        // ---------------- Players ----------------

        const COLUMNS = [
            { key: 'name', label: 'Player', fmt: r => esc(r.name), cls: 'name' },
            { key: 'gp', label: 'GP', fmt: r => r.gp },
            { key: 'record', label: 'W-L', fmt: r => `${r.wins}-${r.losses}${r.ties ? `-${r.ties}` : ''}`, value: r => r.wins - r.losses },
            { key: 'winPct', label: 'Win%', fmt: r => Math.round(r.winPct * 100), value: r => r.winPctSort },
            { key: 'streak', label: 'Streak', fmt: r => r.streak ? `W${r.streak}` : '<span class="dim">–</span>' },
            { key: 'avgPlusMinus', label: '+/-', fmt: r => signed(r.avgPlusMinus, 1) },
            { key: 'points', label: 'Pts', fmt: r => r.trackedGp ? `${r.points}${r.trackedGp < r.gp ? `<span class="dim small"> in ${r.trackedGp}</span>` : ''}` : '<span class="dim">–</span>', value: r => r.trackedGp ? r.points : -1 },
            { key: 'ppg', label: 'PPG', fmt: r => r.ppg === null ? '<span class="dim">–</span>' : r.ppg.toFixed(1) },
            { key: 'high', label: 'High', fmt: r => r.high ? r.high.points : '<span class="dim">–</span>', value: r => r.high?.points ?? -1 }
        ];

        function playerRows(games) {
            return Stats.players(games).map(p => ({ ...p, impact: model.impact(p.id) }));
        }

        function sortedPlayers(games) {
            const col = COLUMNS.find(c => c.key === sort.key);
            const val = r => col.value ? col.value(r) : r[col.key] ?? -Infinity;
            return playerRows(games).sort((a, b) => {
                const va = val(a), vb = val(b);
                const cmp = typeof va === 'string' ? va.localeCompare(vb) : va - vb;
                return (sort.desc ? -cmp : cmp) || b.gp - a.gp || a.name.localeCompare(b.name);
            });
        }

        function playersHtml(games) {
            const rows = sortedPlayers(games);
            if (!rows.length) return '';
            return `
                <div class="card">
                    <h2>Players · ${rangeLabel()}</h2>
                    <div class="table-wrap"><table id="players-table">
                        <thead><tr>${COLUMNS.map(c => `<th class="sortable${sort.key === c.key ? ' sorted' : ''}" data-key="${c.key}">${c.label}${sort.key === c.key ? (sort.desc ? ' ▾' : ' ▴') : ''}</th>`).join('')}</tr></thead>
                        <tbody>${rows.map(r => `<tr class="clickable" data-id="${esc(r.id)}">${COLUMNS.map(c => `<td class="${c.cls || ''}">${c.fmt(r)}</td>`).join('')}</tr>`).join('')}</tbody>
                    </table></div>
                    <div class="note">GP, W-L, Win% and +/- (team's average margin) count every game played. Teams are balanced and reshuffled each week, so Win% sorts with a small-sample guard: 3-0 doesn't jump ahead of 9-3. Streak: wins in a row right now. Pts, PPG and High only count games where player points were tracked (“in 6” = points from 6 tracked games). Tap a player for more.</div>
                </div>
                ${attendanceHtml(games)}`;
        }

        function attendanceHtml(games) {
            const rows = Insights.attendance(games).slice(0, 8);
            if (!rows.length) return '';
            return `
                <div class="card">
                    <h2>Showing up · ${rangeLabel()}</h2>
                    ${rows.map(r => `
                        <div class="hbar-row">
                            <span class="hbar-name">${esc(r.name)}</span>
                            <span class="hbar-track"><span class="hbar seq" style="width:${Math.round(r.pct * 100)}%"></span></span>
                            <span class="hbar-value">${r.gp}/${games.length}${r.streak > 2 ? ` <span class="dim">· ${r.streak} straight</span>` : ''}</span>
                        </div>`).join('')}
                </div>`;
        }

        function bindPlayers(games) {
            const table = document.getElementById('players-table');
            if (!table) return;
            table.querySelectorAll('th.sortable').forEach(th => th.addEventListener('click', () => {
                const key = th.dataset.key;
                sort = { key, desc: sort.key === key ? !sort.desc : key !== 'name' };
                render();
            }));
            const players = playerRows(games);
            table.querySelectorAll('tr.clickable').forEach(tr => tr.addEventListener('click', () =>
                openPlayer(players.find(p => p.id === tr.dataset.id), games)));
        }

        function openPlayer(p, games) {
            if (!p) return;
            const pairs = Insights.playerPairs(games, p.id);
            const style = Insights.scoring(games).find(s => s.id === p.id);
            const att = Insights.attendance(games).find(a => a.id === p.id);

            const pairList = (title, list, note) => list.length ? `
                <div class="card">
                    <h2>${title}</h2>
                    ${list.map(r => `
                        <div class="list-link">
                            <span>${esc(r.bName)} <span class="dim">· ${r.wins}-${r.losses}</span></span>
                            <span class="${r.avg > 0 ? 'win' : 'dim'}">${signed(r.avg, 1)}</span>
                        </div>`).join('')}
                    <div class="note">${note}</div>
                </div>` : '';

            const quarterBars = style?.quarterAvg ? (() => {
                const max = Math.max(0.1, ...style.quarterAvg);
                return `
                    <div class="card">
                        <h2>When they score · per game</h2>
                        <div class="qbars">${style.quarterAvg.map((v, i) => `
                            <div class="qbar"><span class="qv">${v.toFixed(1)}</span><span class="qfill" style="height:${Math.round(56 * v / max) + 4}px"></span><span class="ql">Q${i + 1}</span></div>`).join('')}
                        </div>
                        <div class="note">${style.games} tracked game${style.games === 1 ? '' : 's'} · ${Math.round(style.share * 100)}% of their team's points · best run ${style.streak} straight team baskets</div>
                    </div>`;
            })() : '';

            document.getElementById('sheet-body').innerHTML = `
                <div class="topbar">
                    <h1>${esc(p.name)}</h1>
                    <button class="link-btn" onclick="closeSheet()">Done</button>
                </div>
                <div class="tiles">
                    <div class="tile"><div class="label">Record</div><div class="value">${p.wins}-${p.losses}</div><div class="sub">${Math.round(p.winPct * 100)}% wins${p.ties ? ` · ${p.ties} tied` : ''}${p.streak > 1 ? ` · won ${p.streak} straight` : ''}${p.bestStreak?.count > 1 ? ` · best ${p.bestStreak.count}` : ''}</div></div>
                    <div class="tile"><div class="label">Best game</div><div class="value">${p.high ? p.high.points : '–'}</div><div class="sub">${p.high ? `points · ${formatDate(p.high.game.date)}` : 'no tracked games yet'}</div></div>
                    <div class="tile"><div class="label">Points per game</div><div class="value">${p.ppg === null ? '–' : p.ppg.toFixed(1)}</div><div class="sub">${p.trackedGp} tracked game${p.trackedGp === 1 ? '' : 's'}</div></div>
                    <div class="tile"><div class="label">Showed up</div><div class="value">${att ? Math.round(att.pct * 100) : 0}%</div><div class="sub">${att ? `${att.gp} of ${games.length}${att.streak > 1 ? ` · ${att.streak} straight` : ''}` : ''}</div></div>
                </div>
                ${quarterBars}
                ${pairList('Best with', pairs.teammates.slice(0, 3), 'Teammates, by average margin when on the same team (2+ games).')}
                ${pairList('Toughest opponents', pairs.opponents.slice(-3).reverse(), `${esc(p.name)}'s team margin against these players (2+ games).`)}
                <div class="card">
                    <h2>Games · ${p.gp}</h2>
                    <div class="table-wrap"><table>
                        <thead><tr><th>Date</th><th>Result</th><th>+/-</th><th>Pts</th></tr></thead>
                        <tbody>${p.log.map(l => `
                            <tr class="clickable" onclick="location.href='/Scoreboard/game?id=${encodeURIComponent(l.game.id)}'">
                                <td>${formatDate(l.game.date)}</td>
                                <td><span class="${l.result === 'W' ? 'win' : 'dim'}">${l.result}</span> ${l.game.final[l.team - 1]}–${l.game.final[2 - l.team]}</td>
                                <td>${signed(l.diff)}</td>
                                <td>${l.points === null ? '<span class="dim">–</span>' : l.points}</td>
                            </tr>`).join('')}
                        </tbody>
                    </table></div>
                </div>
                ${samePersonHtml(p)}`;
            bindSamePerson(p);
            sheet.hidden = false;
            document.body.style.overflow = 'hidden';
        }

        // ---------------- One person, several ids ----------------
        // Each iPad used to keep its own player list, so someone can show up twice. See Stats.linkPlayers.

        const allTimeRow = id => Stats.players(allGames).find(r => r.id === id);
        const gameIdsOf = id => new Set(allGames.filter(g => g.players.some(x => x.id === id)).map(g => g.id));

        // Players who could be the same person: never in the same game
        function sameCandidates(p) {
            const mine = gameIdsOf(p.id);
            return Stats.players(allGames)
                .filter(r => r.id !== p.id && ![...gameIdsOf(r.id)].some(id => mine.has(id)))
                .sort((a, b) => a.name.localeCompare(b.name));
        }

        function samePersonHtml(p) {
            const me = allTimeRow(p.id) || p;
            const sources = [...me.sources.values()];
            const how = { name: 'same name, another iPad', link: 'linked', separate: 'kept separate' };
            const action = s => s.how === 'name' ? 'Not the same' : s.how === 'link' || s.how === 'separate' ? 'Undo' : '';
            const listed = sources.length > 1 || sources.some(s => how[s.how] || s.name !== me.name);
            const candidates = sameCandidates(p);
            const intro = me.onRoster
                ? 'Played under another name or on another iPad? Pick that player and their games count here.'
                : 'Not on the scoreboard’s player list, so probably from another iPad. If it’s someone on the list, pick them and these games count for them.';
            return `
                <div class="card same-person">
                    <h2>Same person?</h2>
                    ${listed ? sources.map(s => `
                        <div class="list-link">
                            <span>${esc(s.name)} <span class="dim">· ${s.gp} game${s.gp === 1 ? '' : 's'}${how[s.how] ? ` · ${how[s.how]}` : ''}</span></span>
                            ${action(s) ? `<button class="link-btn" data-source="${esc(s.id)}" data-how="${s.how}">${action(s)}</button>` : ''}
                        </div>`).join('') : ''}
                    ${candidates.length ? `
                    <div class="note">${intro}</div>
                    <div class="same-pick">
                        <select id="same-as" aria-label="Same person as">
                            <option value="">Same person as…</option>
                            ${candidates.map(c => `<option value="${esc(c.id)}">${esc(c.name)} · ${c.gp} game${c.gp === 1 ? '' : 's'}${c.onRoster ? '' : ' · not on the list'}</option>`).join('')}
                        </select>
                        <button class="btn" id="same-link" disabled>Link</button>
                    </div>` : ''}
                    <div class="note" id="same-status"></div>
                </div>`;
        }

        function bindSamePerson(p) {
            const status = document.getElementById('same-status');
            const save = async changes => {
                status.textContent = 'Saving…';
                try {
                    await Stats.setPlayerLinks(changes);
                    status.textContent = 'Saved. Updating stats…';
                    location.reload();
                } catch (e) {
                    status.textContent = e.message;
                }
            };
            document.querySelectorAll('.same-person [data-source]').forEach(b => b.addEventListener('click', () =>
                save({ [b.dataset.source]: b.dataset.how === 'name' ? b.dataset.source : null })));
            const select = document.getElementById('same-as');
            const link = document.getElementById('same-link');
            if (!select) return;
            select.addEventListener('change', () => link.disabled = !select.value);
            link.addEventListener('click', () => {
                const me = allTimeRow(p.id) || p, other = allTimeRow(select.value);
                if (!other) return;
                // Games move onto the player on the scoreboard's list
                const [from, to] = me.onRoster && !other.onRoster ? [other, me] : [me, other];
                save(Object.fromEntries([...from.sources.keys()].map(id => [id, to.id])));
            });
        }

        function closeSheet() {
            sheet.hidden = true;
            document.body.style.overflow = '';
        }

        // ---------------- Insights ----------------

        function insightsHtml(games) {
            return impactHtml() + pairsHtml(games) + scoringHtml(games) + trendHtml(games) + closenessHtml(games);
        }

        function impactHtml() {
            if (!model || model.n < 3) {
                return `<div class="card"><h2>Player impact</h2><div class="note">Needs at least 3 games.</div></div>`;
            }
            // Only the top of the list: it's there to balance teams, not to rank anyone last
            const rows = model.players.filter(r => r.impact > 0.05).slice(0, 5);
            const max = Math.max(1, ...rows.map(r => r.impact));
            const bt = backtest;
            const acc = bt.total ? Math.round(100 * bt.correct / bt.total) : null;
            const verdict = acc === null ? 'Not enough games yet to test it.'
                : acc >= 60 ? `Tested on past games (using only the games before each one), it picked the winner ${bt.correct} of ${bt.total} times (${acc}%).`
                : `Tested on past games (using only the games before each one), it picked the winner ${bt.correct} of ${bt.total} times (${acc}%), so far not much better than a coin flip. It sharpens as games pile up.`;
            return `
                <div class="card">
                    <h2>Biggest impact · all ${model.n} games</h2>
                    ${rows.map(r => `
                        <div class="hbar-row" title="${esc(r.name)}: ${signed(r.impact, 1)} pts per game, ${r.gp} games">
                            <span class="hbar-name">${esc(r.name)}</span>
                            <span class="hbar-track"><span class="hbar seq" style="width:${Math.round(100 * r.impact / max)}%"></span></span>
                            <span class="hbar-value">${signed(r.impact, 1)} <span class="dim">· ${r.gp}g</span></span>
                        </div>`).join('')}
                    <div class="note">Points a player adds to their team's final margin, after accounting for who they played with and against. It only needs who played and the final score, so team-score-only games count too. Recent games count more; players with few games are pulled toward 0. Only the top five are shown: the model is there to make even teams (<b>Balance</b>), not to rank everyone.</div>
                    <div class="note">${verdict} Typical miss: ${bt.mae === null ? '–' : bt.mae.toFixed(1)} points.</div>
                </div>`;
        }

        function pairsHtml(games) {
            const duos = Insights.duos(games).slice(0, 5);
            if (!duos.length) return '';
            return `
                <div class="card">
                    <h2>Best duos · ${rangeLabel()}</h2>
                    ${duos.map(d => `
                        <div class="list-link">
                            <span>${esc(d.aName)} + ${esc(d.bName)} <span class="dim">· ${d.wins}-${d.losses}</span></span>
                            <span class="win">${signed(d.avg, 1)}</span>
                        </div>`).join('')}
                    <div class="note">Average margin when on the same team, 3+ games together.</div>
                </div>`;
        }

        function scoringHtml(games) {
            const rows = Insights.scoring(games).filter(r => r.games > 0).sort((a, b) => b.ppg - a.ppg);
            if (!rows.length) return '';
            const tracked = games.filter(g => g.tracked).length;
            return `
                <div class="card">
                    <h2>Scoring · ${tracked} tracked game${tracked === 1 ? '' : 's'}</h2>
                    <div class="table-wrap"><table>
                        <thead><tr><th>Player</th><th>PPG</th><th title="Share of team points">Share</th><th title="Typical swing game to game">±</th><th title="Share of their points in Q4">Q4</th><th title="Most team baskets in a row">Run</th></tr></thead>
                        <tbody>${rows.map(r => `
                            <tr>
                                <td class="name">${esc(r.name)}</td>
                                <td>${r.ppg.toFixed(1)}</td>
                                <td>${Math.round(r.share * 100)}%</td>
                                <td class="dim">${r.sd.toFixed(1)}</td>
                                <td>${r.q4Share === null ? '<span class="dim">–</span>' : Math.round(r.q4Share * 100) + '%'}</td>
                                <td>${r.streak || '<span class="dim">–</span>'}</td>
                            </tr>`).join('')}
                        </tbody>
                    </table></div>
                    <div class="note">Share: of their team's points. ±: how much their scoring swings game to game. Q4: share of their points scored in the 4th quarter (25% is even). Run: most team baskets in a row.</div>
                </div>`;
        }

        // Total points per game over time, with a tap/hover readout
        function trendHtml(games) {
            const pts = Insights.trend(games);
            if (pts.length < 3) return '';
            const W = 360, H = 170, L = 30, R = 10, T = 12, B = 22;
            const vals = pts.map(p => p.total);
            const lo = Math.max(0, Math.floor((Math.min(...vals) - 4) / 10) * 10);
            const hi = Math.ceil((Math.max(...vals) + 4) / 10) * 10;
            const x = i => L + (pts.length === 1 ? 0 : i * (W - L - R) / (pts.length - 1));
            const y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo || 1));
            const grid = [];
            for (let v = lo; v <= hi; v += (hi - lo) / 2) {
                grid.push(`<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${L - 4}" y="${y(v) + 4}" text-anchor="end">${Math.round(v)}</text>`);
            }
            const avg = vals.reduce((s, v) => s + v, 0) / vals.length;
            const path = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.total).toFixed(1)}`).join('');
            const data = pts.map((p, i) => ({ x: x(i), y: y(p.total), label: `${formatDate(p.date)} · ${p.total} pts (${p.game.final[0]}–${p.game.final[1]})` }));
            const recent = vals.slice(-5).reduce((s, v) => s + v, 0) / Math.min(5, vals.length);
            const dir = recent > avg + 2 ? 'Recent games are higher scoring than usual.' : recent < avg - 2 ? 'Recent games are lower scoring than usual.' : 'Scoring has been steady.';
            return `
                <div class="card">
                    <h2>Points per game · ${rangeLabel()}</h2>
                    <div class="readout" id="trend-readout">Tap the chart for a game</div>
                    <svg class="chart trend" id="trend" viewBox="0 0 ${W} ${H}" data-points='${esc(JSON.stringify(data))}'>
                        ${grid.join('')}
                        <line class="avgline" x1="${L}" x2="${W - R}" y1="${y(avg)}" y2="${y(avg)}"/>
                        <path class="series" d="${path}"/>
                        <circle class="focus" r="5" cx="-20" cy="-20"/>
                        <text class="axis" x="${L}" y="${H - 6}">${esc(formatDate(pts[0].date))}</text>
                        <text class="axis" x="${W - R}" y="${H - 6}" text-anchor="end">${esc(formatDate(pts[pts.length - 1].date))}</text>
                    </svg>
                    <div class="note">Both teams combined. Dashed line: average (${avg.toFixed(1)}). ${dir}</div>
                </div>`;
        }

        function closenessHtml(games) {
            const c = Insights.closeness(games);
            const max = Math.max(1, ...c.buckets.map(b => b.count));
            const close = c.buckets[0].count + c.buckets[1].count;
            return `
                <div class="card">
                    <h2>How close are the games · ${rangeLabel()}</h2>
                    ${c.buckets.map(b => `
                        <div class="hbar-row">
                            <span class="hbar-name">${b.label}</span>
                            <span class="hbar-track"><span class="hbar seq" style="width:${Math.round(100 * b.count / max)}%"></span></span>
                            <span class="hbar-value">${b.count} <span class="dim">· ${Math.round(100 * b.count / c.total)}%</span></span>
                        </div>`).join('')}
                    <div class="note">Final margin. ${Math.round(100 * close / c.total)}% of games were decided by 5 or fewer${c.ties ? `; ${c.ties} tied` : ''}.</div>
                </div>`;
        }

        function bindCharts() {
            const svg = document.getElementById('trend');
            if (!svg) return;
            const points = JSON.parse(svg.dataset.points);
            const focus = svg.querySelector('.focus');
            const readout = document.getElementById('trend-readout');
            const show = e => {
                const box = svg.getBoundingClientRect();
                const vx = (e.clientX - box.left) * (svg.viewBox.baseVal.width / box.width);
                const p = points.reduce((a, b) => Math.abs(b.x - vx) < Math.abs(a.x - vx) ? b : a);
                focus.setAttribute('cx', p.x);
                focus.setAttribute('cy', p.y);
                readout.textContent = p.label;
            };
            svg.addEventListener('pointermove', show);
            svg.addEventListener('pointerdown', show);
        }

        // ---------------- Games ----------------

        function historyHtml(games) {
            let html = '';
            let month = '';
            for (const g of games) {
                const m = g.date ? new Date(g.date + 'T12:00:00').toLocaleDateString(undefined, { month: 'long', year: 'numeric' }) : 'Undated';
                if (m !== month) {
                    month = m;
                    html += `<div class="month">${esc(m)}</div>`;
                }
                const cls = t => g.winner === 0 ? '' : g.winner === t ? 'won' : 'lost';
                html += `
                    <a class="game-row" href="/Scoreboard/game?id=${encodeURIComponent(g.id)}">
                        <div class="top">
                            <span class="date">${formatDate(g.date)}</span>
                            ${g.tracked ? '<span class="badge">Player stats</span>' : g.partial ? '<span class="badge team-only">Team scores · some players</span>' : '<span class="badge team-only">Team scores</span>'}
                        </div>
                        <div class="score">
                            ${sideChip(g, 1)}<span class="n ${cls(1)}">${g.final[0]}</span>
                            <span class="dim">–</span>
                            <span class="n ${cls(2)}">${g.final[1]}</span>${sideChip(g, 2)}
                        </div>
                        ${g.quarters.length ? `<div class="quarters">${g.quarters.map((q, i) => `Q${i + 1} ${q.points[0]}-${q.points[1]}`).join(' · ')}</div>` : ''}
                    </a>`;
            }
            const short = allGames.shortGames || [];
            if (short.length) {
                html += `<div class="card"><div class="note">Not counted: ${short.length} short game${short.length === 1 ? '' : 's'} (under ${Stats.MIN_POINTS} points) · ${short.map(g =>
                    `<a href="/Scoreboard/game?id=${encodeURIComponent(g.id)}">${esc(formatDate(g.date))} ${g.final[0]}–${g.final[1]}</a>`).join(' · ')}</div></div>`;
            }
            const hidden = allGames.hiddenGames || [];
            if (hidden.length) {
                html += `<div class="card" id="removed-games"><div class="note">Removed from stats: ${hidden.map(g =>
                    `<a href="/Scoreboard/game?id=${encodeURIComponent(g.id)}">${esc(formatDate(g.date))} ${g.final[0]}–${g.final[1]}</a>`).join(' · ')}. Open one to put it back.</div></div>`;
            }
            html += dataCheckHtml();
            html += `<div class="note center">Test game or a mistake? Open it and tap <b>Remove from stats</b>.</div>`;
            return html;
        }

        // Things worth a look as games come in: players that may be someone else under another id,
        // and games where most points weren't credited to anyone. Uses every game, not just the range.
        function dataCheckHtml() {
            const rows = Stats.players(allGames);
            const norm = s => s.trim().toLowerCase();
            const sameName = rows.filter(r => rows.some(o => o !== r && norm(o.name) === norm(r.name)));
            const offList = roster?.players?.length ? rows.filter(r => !r.onRoster && !sameName.includes(r)) : [];
            const partial = allGames.filter(g => g.partial);
            if (!sameName.length && !offList.length && !partial.length) return '';
            const who = r => `<span><button class="link-btn" data-player="${esc(r.id)}">${esc(r.name)}</button> <span class="dim">${r.gp}g</span></span>`;
            return `
                <div class="card" id="data-check">
                    <h2>Check the data</h2>
                    ${sameName.length ? `<div class="subhead">Same name, different player</div>
                        <div class="check-list">${sameName.sort((a, b) => a.name.localeCompare(b.name)).map(who).join('')}</div>
                        <div class="note">Usually one person from two iPads. Tap one, then pick <b>Same person as…</b>. If they really are two people, rename one in the Teams panel.</div>` : ''}
                    ${offList.length ? `<div class="subhead">Not on the player list</div>
                        <div class="check-list">${offList.sort((a, b) => a.name.localeCompare(b.name)).map(who).join('')}</div>
                        <div class="note">Played on another iPad, or since removed. If one is someone on the list under another name, tap them and pick <b>Same person as…</b>.</div>` : ''}
                    ${partial.length ? `<div class="subhead">Few points credited to players</div>
                        <div class="note" style="margin-top:0">${partial.map(g => `<a href="/Scoreboard/game?id=${encodeURIComponent(g.id)}">${esc(formatDate(g.date))}</a>`).join(' · ')}: counted as team-score games, so they don’t add to anyone’s points.</div>` : ''}
                </div>`;
        }
    </script>
</body>
</html>
